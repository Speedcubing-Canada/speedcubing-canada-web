# One PR for minor+patch and one for majors, per ecosystem.
version: 2
updates:
  - package-ecosystem: pip
    directory: /back
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]
      python-major:
        update-types: [major]

  - package-ecosystem: npm
    # The lockfile lives at the workspace root, not in front/.
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
    ignore:
      # react-router 8 requires React 19, and react-admin 5 still caps react-router
      # at ^7. Revisit once react-admin ships a React 19 compatible major.
      - dependency-name: react-router
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      # Tracks the Node runtime major (CI node-version); bump together.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # MUI majors (material, x-data-grid, x-date-pickers...) must move together.
      - dependency-name: "@mui/*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]

  - package-ecosystem: docker
    directories:
      - /
      - /back
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # Node major moves with CI node-version and @types/node.
      - dependency-name: node
        update-types: [version-update:semver-major]
